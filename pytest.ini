[pytest]
# 命令行默认参数
# --cov: 统计 app 目录的覆盖率
# --cov-report: 同时输出终端简报和 HTML 详细报告
# --cov-config: 指定覆盖率配置文件（可选）
addopts = --cov=app --cov-report=term-missing --cov-report=html

# 指定测试文件的搜索目录
testpaths = tests

# 注册自定义标记（防止 pytest 报警）
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: tests related to authentication

# 异步插件设置 (针对 pytest-asyncio)
# auto: 自动识别异步测试函数，无需在每个函数上加 @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 忽略不必要的目录
norecursedirs = *.egg .git .venv node_modules
